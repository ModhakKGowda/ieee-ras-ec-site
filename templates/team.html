<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team & Governance - IEEE RAS PESU EC Campus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Cybernetic Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #050811;
        }

        /* Top Navigation Header with Branding Logos */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            background: rgba(5, 8, 17, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #3b82f6;
        }

        /* Main Container & Layout */
        .team-container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .page-subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin: 3rem 0 1.5rem 0;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        /* Glassmorphism Team Cards */
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 1.8rem;
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.25);
        }

        .avatar-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.4);
            margin: 0 auto 1rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .member-name {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .member-role {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .role-gold { color: #f59e0b; }
        .role-blue { color: #60a5fa; }
        .role-green { color: #34d399; }
        .role-purple { color: #c084fc; }
        .role-rose { color: #fb7185; }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.85rem;
        }

        .social-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .social-links a:hover {
            color: #3b82f6;
        }

        .domain-toggle-btn {
            width: 100%;
            background: transparent;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding-top: 0.8rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .domain-members-list {
            display: none;
            text-align: left;
            margin-top: 0.8rem;
            padding-left: 0.8rem;
            border-left: 2px solid rgba(59, 130, 246, 0.4);
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.8;
        }

        .domain-members-list.open {
            display: block;
        }

        /* Social Media Section */
        .socials-section {
            margin-top: 4rem;
            padding: 2.5rem;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .social-grid {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

            display: flex;
            align-items: center;
            gap: 1
